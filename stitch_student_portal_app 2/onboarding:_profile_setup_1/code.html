<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Guided Profile Setup - UniWese</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">tailwind.config = {darkMode: "class", theme: {extend: {colors: {primary: "#338038", "background-light": "#f6f8f6", "background-dark": "#151d15"}, fontFamily: {display: "Inter"}, borderRadius: {DEFAULT: "0.25rem", lg: "0.5rem", xl: "0.75rem", full: "9999px"}}}};</script>
<style type="text/tailwindcss">
        body {
            font-family: 'Inter', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }
        .ios-blur {
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
        }
        .hide-scrollbar::-webkit-scrollbar {
            display: none;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background-light dark:bg-background-dark font-display text-slate-900 dark:text-slate-100 min-h-screen flex flex-col">
<header class="sticky top-0 z-30 bg-white/80 dark:bg-slate-900/80 ios-blur border-b border-slate-200 dark:border-slate-800 px-4 py-3 flex items-center justify-between">
<button class="w-10 h-10 flex items-center justify-center rounded-full active:bg-slate-100 dark:active:bg-slate-800 transition-colors">
<span class="material-symbols-outlined text-slate-600 dark:text-slate-400">arrow_back_ios_new</span>
</button>
<div class="flex flex-col items-center">
<span class="text-[10px] font-bold uppercase tracking-[0.1em] text-slate-400">Step 3 of 3</span>
<h1 class="text-sm font-bold">Profile Setup</h1>
</div>
<button class="text-primary font-semibold text-sm px-2">Skip</button>
</header>
<main class="flex-1 flex flex-col px-6 pt-8 pb-32 max-w-lg mx-auto w-full">
<div class="text-center mb-10">
<h2 class="text-2xl font-extrabold tracking-tight mb-2">Create your identity</h2>
<p class="text-slate-500 dark:text-slate-400 text-sm leading-relaxed">
            Students with professional profiles are 7x more likely to be noticed by top universities and recruiters.
        </p>
</div>
<div class="flex flex-col items-center mb-12">
<div class="relative">
<div class="w-40 h-40 rounded-full bg-white dark:bg-slate-800 border-2 border-dashed border-slate-300 dark:border-slate-700 flex items-center justify-center overflow-hidden shadow-inner ring-8 ring-slate-100 dark:ring-slate-900/50">
<span class="material-symbols-outlined text-slate-300 dark:text-slate-600 text-6xl">account_circle</span>
</div>
<button class="absolute bottom-1 right-2 bg-primary text-white w-11 h-11 rounded-full flex items-center justify-center border-4 border-white dark:border-slate-900 shadow-xl active:scale-95 transition-transform">
<span class="material-symbols-outlined text-[22px]">add_a_photo</span>
</button>
</div>
<p class="mt-4 text-xs font-semibold text-slate-400 uppercase tracking-widest">Profile Picture</p>
</div>
<div class="space-y-6">
<div class="space-y-3">
<div class="flex justify-between items-end">
<label class="text-sm font-bold text-slate-800 dark:text-slate-200" for="bio">Professional Summary</label>
<span class="text-[10px] font-medium text-slate-400 bg-slate-100 dark:bg-slate-800 px-2 py-0.5 rounded">0 / 250</span>
</div>
<div class="relative group">
<textarea class="w-full bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-2xl px-4 py-4 text-sm focus:ring-2 focus:ring-primary/20 focus:border-primary transition-all outline-none resize-none placeholder:text-slate-400 shadow-sm" id="bio" placeholder="E.g. Computer Science aspirant at IIT Delhi, passionate about AI and sustainable tech..." rows="5"></textarea>
<button class="absolute bottom-3 right-3 flex items-center gap-1.5 bg-primary/10 text-primary px-3 py-1.5 rounded-full text-[11px] font-bold hover:bg-primary hover:text-white transition-all">
<span class="material-symbols-outlined text-[16px]">auto_awesome</span>
                    AI Refine
                </button>
</div>
</div>
<div class="space-y-3">
<div class="flex items-center gap-2">
<span class="material-symbols-outlined text-primary text-sm">lightbulb</span>
<p class="text-[11px] font-bold text-slate-500 uppercase tracking-wider">Quick Templates</p>
</div>
<div class="flex gap-3 overflow-x-auto hide-scrollbar pb-2 -mx-1 px-1">
<button class="flex-shrink-0 bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 p-3 rounded-xl w-48 text-left hover:border-primary transition-colors shadow-sm">
<p class="text-[10px] font-bold text-primary mb-1 italic">Academic Focus</p>
<p class="text-[11px] text-slate-500 line-clamp-2 leading-snug">Focused on pursuing a career in Data Science with a strong foundation in Mathematics...</p>
</button>
<button class="flex-shrink-0 bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 p-3 rounded-xl w-48 text-left hover:border-primary transition-colors shadow-sm">
<p class="text-[10px] font-bold text-primary mb-1 italic">Leadership &amp; Extra</p>
<p class="text-[11px] text-slate-500 line-clamp-2 leading-snug">Active student leader and state-level debater aiming for Humanities at top-tier...</p>
</button>
<button class="flex-shrink-0 bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 p-3 rounded-xl w-48 text-left hover:border-primary transition-colors shadow-sm">
<p class="text-[10px] font-bold text-primary mb-1 italic">STEM Aspirant</p>
<p class="text-[11px] text-slate-500 line-clamp-2 leading-snug">Aspiring engineer with a keen interest in robotics and competitive programming...</p>
</button>
</div>
</div>
</div>
</main>
<div class="fixed bottom-0 left-0 right-0 p-6 bg-white/90 dark:bg-slate-900/90 ios-blur border-t border-slate-100 dark:border-slate-800 z-40">
<div class="max-w-md mx-auto space-y-4">
<div class="flex items-center justify-center gap-2 mb-2">
<div class="h-1 w-8 rounded-full bg-primary"></div>
<div class="h-1 w-8 rounded-full bg-primary"></div>
<div class="h-1 w-8 rounded-full bg-primary"></div>
</div>
<button class="w-full bg-primary hover:bg-primary/95 text-white font-bold py-4 rounded-2xl shadow-xl shadow-primary/20 active:scale-[0.98] transition-all flex items-center justify-center gap-3">
            Finish Profile
            <span class="material-symbols-outlined">arrow_forward</span>
</button>
<p class="text-[10px] text-center text-slate-400 font-medium">
            Step 3: Verification will follow after profile completion.
        </p>
</div>
<div class="h-4"></div>
</div>
</body></html>
