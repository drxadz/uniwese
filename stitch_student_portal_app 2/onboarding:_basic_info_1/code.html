<body class="bg-white text-slate-900 font-sans">
<div class="relative mx-auto flex h-screen max-w-[430px] flex-col bg-white overflow-hidden">
<nav class="flex items-center justify-between px-6 pt-12 pb-4">
<button class="flex items-center text-slate-400 hover:text-slate-900 transition-colors">
<span class="material-symbols-outlined text-2xl">arrow_back</span>
</button>
<div class="flex-1 flex justify-center">
<div class="flex gap-1.5">
<div class="h-1 w-8 rounded-full bg-primary-navy"></div>
<div class="h-1 w-8 rounded-full bg-slate-100"></div>
<div class="h-1 w-8 rounded-full bg-slate-100"></div>
</div>
</div>
<div class="w-8"></div>

<header class="px-8 pt-8 pb-4 text-center">
<h1 class="text-3xl font-bold tracking-tight text-slate-900 mb-3">Your Profile</h1>
<div class="flex items-center justify-center gap-2 text-slate-500">
<span class="material-symbols-outlined text-sm text-green-600">verified_user</span>
<p class="text-xs font-medium">Your data is encrypted and only used for college matching.</p>
</div>
</header>
<main class="flex-1 overflow-y-auto px-8 py-6 hide-scrollbar">
<div class="space-y-10 max-w-sm mx-auto">
<div class="group border-b border-slate-100 focus-within:border-primary-navy transition-all duration-300">
<label class="block text-xs font-bold uppercase tracking-widest text-slate-400 mb-1 group-focus-within:text-primary-navy" for="full-name">
                        Full Name
                    </label>
<input class="w-full border-none bg-transparent px-0 py-3 text-xl font-medium text-slate-900 placeholder:text-slate-200 focus:ring-0" id="full-name" placeholder="Type your name..." type="text"/>
</div>
<div class="group border-b border-slate-100 focus-within:border-primary-navy transition-all duration-300">
<label class="block text-xs font-bold uppercase tracking-widest text-slate-400 mb-1 group-focus-within:text-primary-navy" for="education-level">
                        Current Education
                    </label>
<div class="relative">
<select class="w-full appearance-none border-none bg-transparent px-0 py-3 text-xl font-medium text-slate-900 focus:ring-0" id="education-level">
<option disabled="" selected="" value="">Select level</option>
<option value="class-10">Class 10</option>
<option value="class-11">Class 11</option>
<option value="class-12">Class 12</option>
<option value="ug">Undergraduate</option>
</select>
<div class="pointer-events-none absolute inset-y-0 right-0 flex items-center text-slate-300">
<span class="material-symbols-outlined">expand_more</span>
</div>
</div>
</div>
<div class="group border-b border-slate-100 focus-within:border-primary-navy transition-all duration-300">
<label class="block text-xs font-bold uppercase tracking-widest text-slate-400 mb-1 group-focus-within:text-primary-navy" for="interested-degree">
                        Goal Degree
                    </label>
<div class="relative">
<select class="w-full appearance-none border-none bg-transparent px-0 py-3 text-xl font-medium text-slate-900 focus:ring-0" id="interested-degree">
<option disabled="" selected="" value="">Interested in...</option>
<option value="btech">B.Tech / Engineering</option>
<option value="mbbs">MBBS / Medical</option>
<option value="bba">BBA / Management</option>
<option value="arts">Design &amp; Arts</option>
</select>
<div class="pointer-events-none absolute inset-y-0 right-0 flex items-center text-slate-300">
<span class="material-symbols-outlined">expand_more</span>
</div>
</div>
</div>
</div>
<div class="mt-16 flex justify-center opacity-[0.03]">
