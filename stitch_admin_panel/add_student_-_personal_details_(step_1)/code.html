<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Add Student - Personal Details</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#0a69c2",
                        "primary-hover": "#0857a3",
                        "primary-light": "#e6f0fa",
                        "background-light": "#f5f7f8",
                        "background-dark": "#101922",
                    },
                    fontFamily: {
                        "display": ["Inter", "sans-serif"]
                    },
                    borderRadius: {
                        "DEFAULT": "0.5rem", // 8px
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "2xl": "1rem",
                        "full": "9999px"
                    },
                },
            },
        }
    </script>
</head>
<body class="bg-background-light dark:bg-background-dark font-display text-slate-900 dark:text-white min-h-screen flex items-center justify-center p-4">
<!-- Modal Overlay -->
<div aria-hidden="true" class="fixed inset-0 bg-slate-900/40 backdrop-blur-sm z-40 transition-opacity"></div>
<!-- Modal Container -->
<div class="relative z-50 w-full max-w-4xl bg-white dark:bg-slate-800 rounded-lg shadow-2xl flex flex-col max-h-[90vh] overflow-hidden">
<!-- Header & Close Button -->
<div class="flex items-center justify-between px-8 py-6 border-b border-slate-200 dark:border-slate-700">
<h2 class="text-2xl font-bold tracking-tight text-slate-900 dark:text-white">Add New Student</h2>
<button class="text-slate-400 hover:text-slate-600 dark:hover:text-slate-200 transition-colors p-2 rounded-full hover:bg-slate-100 dark:hover:bg-slate-700">
<span class="material-symbols-outlined text-2xl leading-none">close</span>
</button>
</div>
<!-- Stepper -->
<div class="bg-slate-50 dark:bg-slate-800/50 px-8 py-6 border-b border-slate-200 dark:border-slate-700">
<div class="flex items-center justify-between relative max-w-2xl mx-auto">
<!-- Connecting Line -->
<div class="absolute top-1/2 left-0 w-full h-0.5 bg-slate-200 dark:bg-slate-600 -z-10 -translate-y-1/2"></div>
<!-- Step 1: Active -->
<div class="flex flex-col items-center gap-2 bg-slate-50 dark:bg-slate-800 px-2 relative z-10">
<div class="w-10 h-10 rounded-full bg-primary text-white flex items-center justify-center font-semibold shadow-md shadow-primary/30">
                        1
                    </div>
<span class="text-sm font-semibold text-primary">Personal Details</span>
</div>
<!-- Step 2: Inactive -->
<div class="flex flex-col items-center gap-2 bg-slate-50 dark:bg-slate-800 px-2 relative z-10">
<div class="w-10 h-10 rounded-full bg-white dark:bg-slate-700 border-2 border-slate-300 dark:border-slate-500 text-slate-500 dark:text-slate-400 flex items-center justify-center font-semibold">
                        2
                    </div>
<span class="text-sm font-medium text-slate-500 dark:text-slate-400">Academic Info</span>
</div>
<!-- Step 3: Inactive -->
<div class="flex flex-col items-center gap-2 bg-slate-50 dark:bg-slate-800 px-2 relative z-10">
<div class="w-10 h-10 rounded-full bg-white dark:bg-slate-700 border-2 border-slate-300 dark:border-slate-500 text-slate-500 dark:text-slate-400 flex items-center justify-center font-semibold">
                        3
                    </div>
<span class="text-sm font-medium text-slate-500 dark:text-slate-400">Preferences</span>
</div>
</div>
</div>
<!-- Form Content (Scrollable) -->
<div class="flex-1 overflow-y-auto px-8 py-8">
<div class="max-w-3xl mx-auto space-y-8">
<!-- Section Header -->
<div class="flex items-center gap-2 mb-6">
<div class="h-6 w-1 rounded-full bg-primary"></div>
<h3 class="text-lg font-semibold text-slate-900 dark:text-white">Basic Information</h3>
</div>
<!-- Inputs Grid -->
<div class="grid grid-cols-1 md:grid-cols-2 gap-6">
<!-- Full Name -->
<label class="flex flex-col gap-2">
<span class="text-sm font-medium text-slate-700 dark:text-slate-200">Full Name</span>
<div class="relative group">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-slate-400 group-focus-within:text-primary transition-colors text-[20px]">person</span>
<input class="form-input w-full pl-10 h-11 rounded-lg border-slate-300 dark:border-slate-600 bg-white dark:bg-slate-900 text-slate-900 dark:text-white placeholder:text-slate-400 focus:border-primary focus:ring-1 focus:ring-primary transition-shadow" placeholder="e.g. John Doe" type="text"/>
</div>
</label>
<!-- Email Address -->
<label class="flex flex-col gap-2">
<span class="text-sm font-medium text-slate-700 dark:text-slate-200">Email Address</span>
<div class="relative group">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-slate-400 group-focus-within:text-primary transition-colors text-[20px]">mail</span>
<input class="form-input w-full pl-10 h-11 rounded-lg border-slate-300 dark:border-slate-600 bg-white dark:bg-slate-900 text-slate-900 dark:text-white placeholder:text-slate-400 focus:border-primary focus:ring-1 focus:ring-primary transition-shadow" placeholder="e.g. john@example.com" type="email"/>
</div>
</label>
<!-- Phone Number -->
<label class="flex flex-col gap-2">
<span class="text-sm font-medium text-slate-700 dark:text-slate-200">Phone Number</span>
<div class="relative group">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-slate-400 group-focus-within:text-primary transition-colors text-[20px]">call</span>
<input class="form-input w-full pl-10 h-11 rounded-lg border-slate-300 dark:border-slate-600 bg-white dark:bg-slate-900 text-slate-900 dark:text-white placeholder:text-slate-400 focus:border-primary focus:ring-1 focus:ring-primary transition-shadow" placeholder="+1 (555) 000-0000" type="tel"/>
</div>
</label>
<!-- Date of Birth -->
<label class="flex flex-col gap-2">
<span class="text-sm font-medium text-slate-700 dark:text-slate-200">Date of Birth</span>
<div class="relative group">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-slate-400 group-focus-within:text-primary transition-colors text-[20px]">calendar_today</span>
<input class="form-input w-full pl-10 h-11 rounded-lg border-slate-300 dark:border-slate-600 bg-white dark:bg-slate-900 text-slate-900 dark:text-white placeholder:text-slate-400 focus:border-primary focus:ring-1 focus:ring-primary transition-shadow" type="date"/>
</div>
</label>
</div>
<!-- Divider -->
<div class="h-px bg-slate-200 dark:bg-slate-700"></div>
<!-- Gender Section -->
<div>
<span class="block text-sm font-medium text-slate-700 dark:text-slate-200 mb-3">Gender</span>
<div class="grid grid-cols-2 md:grid-cols-4 gap-3">
<label class="cursor-pointer relative">
<input checked="" class="peer sr-only" name="gender" type="radio"/>
<div class="flex items-center justify-center h-12 rounded-lg border border-slate-300 dark:border-slate-600 bg-white dark:bg-slate-900 text-slate-700 dark:text-slate-300 peer-checked:border-primary peer-checked:bg-primary/5 peer-checked:text-primary hover:bg-slate-50 dark:hover:bg-slate-800 transition-all font-medium text-sm">
                                Male
                            </div>
<div class="absolute top-1 right-1 hidden peer-checked:block text-primary">
<span class="material-symbols-outlined text-[16px] leading-none">check_circle</span>
</div>
</label>
<label class="cursor-pointer relative">
<input class="peer sr-only" name="gender" type="radio"/>
<div class="flex items-center justify-center h-12 rounded-lg border border-slate-300 dark:border-slate-600 bg-white dark:bg-slate-900 text-slate-700 dark:text-slate-300 peer-checked:border-primary peer-checked:bg-primary/5 peer-checked:text-primary hover:bg-slate-50 dark:hover:bg-slate-800 transition-all font-medium text-sm">
                                Female
                            </div>
<div class="absolute top-1 right-1 hidden peer-checked:block text-primary">
<span class="material-symbols-outlined text-[16px] leading-none">check_circle</span>
</div>
</label>
<label class="cursor-pointer relative">
<input class="peer sr-only" name="gender" type="radio"/>
<div class="flex items-center justify-center h-12 rounded-lg border border-slate-300 dark:border-slate-600 bg-white dark:bg-slate-900 text-slate-700 dark:text-slate-300 peer-checked:border-primary peer-checked:bg-primary/5 peer-checked:text-primary hover:bg-slate-50 dark:hover:bg-slate-800 transition-all font-medium text-sm">
                                Non-binary
                            </div>
<div class="absolute top-1 right-1 hidden peer-checked:block text-primary">
<span class="material-symbols-outlined text-[16px] leading-none">check_circle</span>
</div>
</label>
<label class="cursor-pointer relative">
<input class="peer sr-only" name="gender" type="radio"/>
<div class="flex items-center justify-center h-12 rounded-lg border border-slate-300 dark:border-slate-600 bg-white dark:bg-slate-900 text-slate-700 dark:text-slate-300 peer-checked:border-primary peer-checked:bg-primary/5 peer-checked:text-primary hover:bg-slate-50 dark:hover:bg-slate-800 transition-all font-medium text-sm">
                                Other
                            </div>
<div class="absolute top-1 right-1 hidden peer-checked:block text-primary">
<span class="material-symbols-outlined text-[16px] leading-none">check_circle</span>
</div>
</label>
</div>
</div>
</div>
</div>
<!-- Footer Actions -->
<div class="px-8 py-5 bg-slate-50 dark:bg-slate-800/50 border-t border-slate-200 dark:border-slate-700 flex justify-end gap-3">
<button class="px-6 h-11 rounded-lg border border-slate-300 dark:border-slate-600 text-slate-700 dark:text-slate-200 font-medium hover:bg-slate-100 dark:hover:bg-slate-700 transition-colors focus:outline-none focus:ring-2 focus:ring-slate-300">
                Cancel
            </button>
<button class="px-8 h-11 rounded-lg bg-primary text-white font-medium hover:bg-primary-hover transition-colors shadow-sm focus:outline-none focus:ring-2 focus:ring-primary focus:ring-offset-2 dark:focus:ring-offset-slate-900 flex items-center gap-2">
                Next Step
                <span class="material-symbols-outlined text-[20px]">arrow_forward</span>
</button>
</div>
</div>
</body></html>
