<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Admin Password Recovery - UniWese</title>
<!-- Tailwind CSS -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<!-- Theme Configuration -->
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#0a69c2",
                        "background-light": "#f5f7f8",
                        "background-dark": "#101922",
                    },
                    fontFamily: {
                        "display": ["Inter", "sans-serif"]
                    },
                    borderRadius: {"DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px"},
                },
            },
        }
    </script>
<!-- Google Fonts -->
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<!-- Material Symbols -->
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<style>
        body {
            font-family: 'Inter', sans-serif;
        }
        /* Custom styles to handle autofill background color */
        input:-webkit-autofill,
        input:-webkit-autofill:hover, 
        input:-webkit-autofill:focus, 
        input:-webkit-autofill:active{
            -webkit-box-shadow: 0 0 0 30px #f5f7f8 inset !important;
        }
        .dark input:-webkit-autofill,
        .dark input:-webkit-autofill:hover, 
        .dark input:-webkit-autofill:focus, 
        .dark input:-webkit-autofill:active{
            -webkit-box-shadow: 0 0 0 30px #1e293b inset !important;
            -webkit-text-fill-color: white !important;
        }
    </style>
</head>
<body class="bg-background-light dark:bg-background-dark min-h-screen flex items-center justify-center font-display text-slate-900 dark:text-slate-100 p-4">
<div class="w-full max-w-[480px] bg-white dark:bg-[#1e293b] rounded-xl shadow-lg border border-slate-200 dark:border-slate-700 overflow-hidden relative">
<!-- Decorative subtle top border accent -->
<div class="h-1.5 w-full bg-primary absolute top-0 left-0"></div>
<div class="p-8 md:p-10 flex flex-col items-center">
<!-- Logo Section -->
<div class="mb-8 flex flex-col items-center">
<!-- Using a placeholder logo that fits the theme -->
<div class="w-12 h-12 bg-primary/10 rounded-lg flex items-center justify-center mb-3">
<span class="material-symbols-outlined text-primary text-3xl">admin_panel_settings</span>
</div>
<h2 class="text-xl font-bold text-slate-900 dark:text-white tracking-tight">UniWese <span class="text-primary">Admin</span></h2>
</div>
<!-- Content Header -->
<div class="text-center mb-8">
<h1 class="text-2xl md:text-3xl font-bold text-slate-900 dark:text-white mb-3">Reset Your Password</h1>
<p class="text-slate-500 dark:text-slate-400 text-sm md:text-base leading-relaxed max-w-sm mx-auto">
                    Enter the email address associated with your account and we will send you a link to reset your password.
                </p>
</div>
<!-- Form Section -->
<form class="w-full flex flex-col gap-5" onsubmit="event.preventDefault();">
<!-- Email Input -->
<div class="space-y-2">
<label class="block text-sm font-medium text-slate-700 dark:text-slate-300" for="email">
                        Email Address
                    </label>
<div class="relative group">
<div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-slate-400 group-focus-within:text-primary transition-colors text-[20px]">mail</span>
</div>
<input autofocus="" class="block w-full rounded-lg border-slate-300 dark:border-slate-600 bg-background-light dark:bg-slate-800 text-slate-900 dark:text-white pl-10 pr-3 py-3 focus:border-primary focus:ring-1 focus:ring-primary sm:text-sm placeholder:text-slate-400 transition-all shadow-sm" id="email" name="email" placeholder="name@uniwese.com" required="" type="email"/>
</div>
</div>
<!-- Submit Button -->
<button class="w-full flex items-center justify-center rounded-lg bg-primary px-4 py-3 text-sm font-semibold text-white shadow-sm hover:bg-primary/90 focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-primary transition-colors duration-200 group mt-2" type="submit">
<span>Send Reset Link</span>
<span class="material-symbols-outlined ml-2 text-[18px] group-hover:translate-x-0.5 transition-transform">arrow_forward</span>
</button>
</form>
<!-- Back to Login -->
<div class="mt-8 pt-6 border-t border-slate-100 dark:border-slate-700 w-full flex justify-center">
<a class="inline-flex items-center text-sm font-medium text-slate-500 hover:text-primary dark:text-slate-400 dark:hover:text-primary transition-colors" href="#">
<span class="material-symbols-outlined mr-1.5 text-[18px]">arrow_back</span>
                    Back to Login
                </a>
</div>
</div>
</div>
</body></html>
