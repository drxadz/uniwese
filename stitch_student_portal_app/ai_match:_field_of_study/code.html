<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>AI Match: Field of Study</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script>
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#338038",
                        "primary-light": "#eaf0eb", // Lighter tint for backgrounds
                        "primary-dark": "#1a4d1d", // Darker shade for contrast
                        "background-light": "#f6f8f6",
                        "background-dark": "#151d15",
                    },
                    fontFamily: {
                        "display": ["Inter", "sans-serif"]
                    },
                    borderRadius: {"DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px"},
                },
            },
        }
    </script>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background-light dark:bg-background-dark font-display antialiased text-slate-900 dark:text-slate-100 flex flex-col min-h-screen">
<!-- Top Navigation / Header -->
<div class="sticky top-0 z-50 bg-background-light/95 dark:bg-background-dark/95 backdrop-blur-sm border-b border-slate-200 dark:border-slate-800 px-4 pt-12 pb-3 flex items-center justify-between">
<button class="p-2 -ml-2 rounded-full hover:bg-slate-100 dark:hover:bg-slate-800 transition-colors text-slate-900 dark:text-slate-100">
<span class="material-symbols-outlined">arrow_back</span>
</button>
<h2 class="text-lg font-bold tracking-tight text-center flex-1 pr-8">Course Matcher</h2>
</div>
<!-- Main Content Area -->
<main class="flex-1 flex flex-col p-4 gap-6 pb-24 overflow-y-auto">
<!-- Progress Section -->
<div class="flex flex-col gap-2">
<div class="flex justify-between items-end">
<p class="text-sm font-semibold text-primary">Step 1 of 5</p>
<p class="text-xs text-slate-500 dark:text-slate-400">20% Completed</p>
</div>
<div class="h-2 w-full bg-slate-200 dark:bg-slate-700 rounded-full overflow-hidden">
<div class="h-full bg-primary rounded-full transition-all duration-500 ease-out" style="width: 20%"></div>
</div>
</div>
<!-- Heading -->
<div>
<h1 class="text-2xl font-bold leading-tight mb-2 text-slate-900 dark:text-white">What is your preferred field of study?</h1>
<p class="text-sm text-slate-500 dark:text-slate-400">Select a category below or search for a specific major to get better AI recommendations.</p>
</div>
<!-- Search Bar -->
<div class="relative group">
<div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-slate-400 group-focus-within:text-primary transition-colors">search</span>
</div>
<input class="block w-full pl-10 pr-3 py-3 border border-slate-200 dark:border-slate-700 rounded-xl leading-5 bg-white dark:bg-slate-800 text-slate-900 dark:text-slate-100 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-primary focus:border-primary sm:text-sm shadow-sm transition-all" placeholder="Search majors like 'Robotics' or 'Finance'" type="text"/>
</div>
<!-- Grid of Options -->
<div class="grid grid-cols-2 gap-3">
<!-- Option 1: Engineering (Selected State) -->
<button class="relative flex flex-col items-center justify-center p-4 gap-3 bg-primary/10 dark:bg-primary/20 border-2 border-primary rounded-xl transition-all shadow-sm">
<div class="absolute top-3 right-3 text-primary">
<span class="material-symbols-outlined text-[20px] fill-1">check_circle</span>
</div>
<div class="w-12 h-12 rounded-full bg-primary/20 flex items-center justify-center text-primary mb-1">
<span class="material-symbols-outlined text-[28px]">engineering</span>
</div>
<span class="text-sm font-semibold text-primary text-center">Engineering</span>
</button>
<!-- Option 2: Business -->
<button class="flex flex-col items-center justify-center p-4 gap-3 bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 hover:border-primary/50 dark:hover:border-primary/50 rounded-xl transition-all shadow-sm hover:shadow-md group">
<div class="w-12 h-12 rounded-full bg-slate-100 dark:bg-slate-700 group-hover:bg-primary/10 flex items-center justify-center text-slate-600 dark:text-slate-300 group-hover:text-primary transition-colors mb-1">
<span class="material-symbols-outlined text-[28px]">business_center</span>
</div>
<span class="text-sm font-medium text-slate-700 dark:text-slate-200 group-hover:text-primary text-center">Business</span>
</button>
<!-- Option 3: Computer Science -->
<button class="flex flex-col items-center justify-center p-4 gap-3 bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 hover:border-primary/50 dark:hover:border-primary/50 rounded-xl transition-all shadow-sm hover:shadow-md group">
<div class="w-12 h-12 rounded-full bg-slate-100 dark:bg-slate-700 group-hover:bg-primary/10 flex items-center justify-center text-slate-600 dark:text-slate-300 group-hover:text-primary transition-colors mb-1">
<span class="material-symbols-outlined text-[28px]">terminal</span>
</div>
<span class="text-sm font-medium text-slate-700 dark:text-slate-200 group-hover:text-primary text-center">Comp Sci</span>
</button>
<!-- Option 4: Arts & Design -->
<button class="flex flex-col items-center justify-center p-4 gap-3 bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 hover:border-primary/50 dark:hover:border-primary/50 rounded-xl transition-all shadow-sm hover:shadow-md group">
<div class="w-12 h-12 rounded-full bg-slate-100 dark:bg-slate-700 group-hover:bg-primary/10 flex items-center justify-center text-slate-600 dark:text-slate-300 group-hover:text-primary transition-colors mb-1">
<span class="material-symbols-outlined text-[28px]">palette</span>
</div>
<span class="text-sm font-medium text-slate-700 dark:text-slate-200 group-hover:text-primary text-center">Arts &amp; Design</span>
</button>
<!-- Option 5: Medicine -->
<button class="flex flex-col items-center justify-center p-4 gap-3 bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 hover:border-primary/50 dark:hover:border-primary/50 rounded-xl transition-all shadow-sm hover:shadow-md group">
<div class="w-12 h-12 rounded-full bg-slate-100 dark:bg-slate-700 group-hover:bg-primary/10 flex items-center justify-center text-slate-600 dark:text-slate-300 group-hover:text-primary transition-colors mb-1">
<span class="material-symbols-outlined text-[28px]">medical_services</span>
</div>
<span class="text-sm font-medium text-slate-700 dark:text-slate-200 group-hover:text-primary text-center">Medicine</span>
</button>
<!-- Option 6: Law -->
<button class="flex flex-col items-center justify-center p-4 gap-3 bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 hover:border-primary/50 dark:hover:border-primary/50 rounded-xl transition-all shadow-sm hover:shadow-md group">
<div class="w-12 h-12 rounded-full bg-slate-100 dark:bg-slate-700 group-hover:bg-primary/10 flex items-center justify-center text-slate-600 dark:text-slate-300 group-hover:text-primary transition-colors mb-1">
<span class="material-symbols-outlined text-[28px]">gavel</span>
</div>
<span class="text-sm font-medium text-slate-700 dark:text-slate-200 group-hover:text-primary text-center">Law</span>
</button>
<!-- Option 7: Sciences -->
<button class="flex flex-col items-center justify-center p-4 gap-3 bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 hover:border-primary/50 dark:hover:border-primary/50 rounded-xl transition-all shadow-sm hover:shadow-md group">
<div class="w-12 h-12 rounded-full bg-slate-100 dark:bg-slate-700 group-hover:bg-primary/10 flex items-center justify-center text-slate-600 dark:text-slate-300 group-hover:text-primary transition-colors mb-1">
<span class="material-symbols-outlined text-[28px]">biotech</span>
</div>
<span class="text-sm font-medium text-slate-700 dark:text-slate-200 group-hover:text-primary text-center">Sciences</span>
</button>
<!-- Option 8: Other -->
<button class="flex flex-col items-center justify-center p-4 gap-3 bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 hover:border-primary/50 dark:hover:border-primary/50 rounded-xl transition-all shadow-sm hover:shadow-md group">
<div class="w-12 h-12 rounded-full bg-slate-100 dark:bg-slate-700 group-hover:bg-primary/10 flex items-center justify-center text-slate-600 dark:text-slate-300 group-hover:text-primary transition-colors mb-1">
<span class="material-symbols-outlined text-[28px]">more_horiz</span>
</div>
<span class="text-sm font-medium text-slate-700 dark:text-slate-200 group-hover:text-primary text-center">Other</span>
</button>
</div>
<!-- Floating Continue Button -->
<div class="fixed bottom-20 left-0 right-0 p-4 bg-gradient-to-t from-background-light via-background-light to-transparent dark:from-background-dark dark:via-background-dark pointer-events-none flex justify-center z-10">
<button class="pointer-events-auto w-full max-w-md bg-primary hover:bg-primary-dark text-white font-semibold py-3.5 px-6 rounded-full shadow-lg shadow-primary/30 flex items-center justify-center gap-2 transition-all transform active:scale-95">
                Continue
                <span class="material-symbols-outlined text-sm">arrow_forward</span>
</button>
</div>
</main>
<!-- Bottom Navigation Bar -->
<div class="fixed bottom-0 left-0 right-0 bg-white dark:bg-slate-900 border-t border-slate-200 dark:border-slate-800 px-4 pb-6 pt-2 z-50">
<div class="flex justify-between items-center max-w-lg mx-auto">
<!-- Active Tab (Home) -->
<a class="flex flex-1 flex-col items-center justify-end gap-1 text-primary" href="#">
<div class="flex h-6 items-center justify-center mb-0.5">
<span class="material-symbols-outlined text-[24px] fill-1">home</span>
</div>
<p class="text-[10px] font-medium leading-normal tracking-wide">Home</p>
</a>
<!-- Inactive Tabs -->
<a class="flex flex-1 flex-col items-center justify-end gap-1 text-slate-400 dark:text-slate-500 hover:text-slate-600 dark:hover:text-slate-300 transition-colors" href="#">
<div class="flex h-6 items-center justify-center mb-0.5">
<span class="material-symbols-outlined text-[24px]">group</span>
</div>
<p class="text-[10px] font-medium leading-normal tracking-wide">Network</p>
</a>
<a class="flex flex-1 flex-col items-center justify-end gap-1 text-slate-400 dark:text-slate-500 hover:text-slate-600 dark:hover:text-slate-300 transition-colors" href="#">
<div class="flex h-6 items-center justify-center mb-0.5">
<span class="material-symbols-outlined text-[24px]">notifications</span>
</div>
<p class="text-[10px] font-medium leading-normal tracking-wide">Notifications</p>
</a>
<a class="flex flex-1 flex-col items-center justify-end gap-1 text-slate-400 dark:text-slate-500 hover:text-slate-600 dark:hover:text-slate-300 transition-colors" href="#">
<div class="flex h-6 items-center justify-center mb-0.5">
<span class="material-symbols-outlined text-[24px]">chat_bubble</span>
</div>
<p class="text-[10px] font-medium leading-normal tracking-wide">Messages</p>
</a>
<a class="flex flex-1 flex-col items-center justify-end gap-1 text-slate-400 dark:text-slate-500 hover:text-slate-600 dark:hover:text-slate-300 transition-colors" href="#">
<div class="flex h-6 items-center justify-center mb-0.5">
<span class="material-symbols-outlined text-[24px]">person</span>
</div>
<p class="text-[10px] font-medium leading-normal tracking-wide">Profile</p>
</a>
</div>
</div>
</body></html>
